<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4a00e0,#8e2de2);
}

.container{
text-align:center;
color:white;
}

h1{
margin-bottom:20px;
}

.status{
font-size:22px;
margin-bottom:20px;
font-weight:bold;
}

.board{
display:grid;
grid-template-columns:repeat(3,100px);
grid-template-rows:repeat(3,100px);
gap:8px;
justify-content:center;
}

.cell{
background:white;
border:none;
font-size:40px;
font-weight:bold;
cursor:pointer;
border-radius:10px;
}

.cell:hover{
background:#f0f0f0;
}

button{
padding:10px 20px;
margin-top:20px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

@media(max-width:500px){
.board{
grid-template-columns:repeat(3,80px);
grid-template-rows:repeat(3,80px);
}
}
</style>
</head>

<body>

<div class="container">
<h1>🎮 Tic Tac Toe</h1>

<div class="status" id="status">
Player X Turn
</div>

<div class="board">
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
</div>

<button onclick="resetGame()">Reset Game</button>
</div>

<script>

const cells=document.querySelectorAll(".cell");
const statusText=document.getElementById("status");

let currentPlayer="X";
let gameActive=true;

const winPatterns=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];

cells.forEach(cell=>{
cell.addEventListener("click",cellClick);
});

function cellClick(){

if(this.textContent!=="" || !gameActive){
return;
}

this.textContent=currentPlayer;

checkWinner();

if(gameActive){
currentPlayer=currentPlayer==="X" ? "O" : "X";
statusText.textContent=`Player ${currentPlayer} Turn`;
}
}

function checkWinner(){

for(let pattern of winPatterns){

let a=cells[pattern[0]].textContent;
let b=cells[pattern[1]].textContent;
let c=cells[pattern[2]].textContent;

if(a==="" || b==="" || c===""){
continue;
}

if(a===b && b===c){
statusText.textContent=`🎉 Player ${a} Wins!`;
gameActive=false;
return;
}
}

let draw=true;

cells.forEach(cell=>{
if(cell.textContent===""){
draw=false;
}
});

if(draw){
statusText.textContent="🤝 Match Draw!";
gameActive=false;
}
}

function resetGame(){

cells.forEach(cell=>{
cell.textContent="";
});

currentPlayer="X";
gameActive=true;

statusText.textContent="Player X Turn";
}

</script>

</body>
</html>
